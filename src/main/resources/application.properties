spring.application.name=demo

# Redis. When the app runs from this directory, Spring Boot starts compose.yaml and points Redisson at it.
# Without that (or another Redis setting), startup fails here instead of quietly using a Redis on localhost:6379.
spring.data.redis.host=redis-not-configured

# Locksmith: the prefix of every Redis key it uses (default "locksmith:").
locksmith.key-prefix=demo:
# Locksmith: the lease of a semaphore permit when @DistributedSemaphore sets no leaseTime (default 5m).
locksmith.semaphore.lease-time=1m

# Redisson renews a lock taken without leaseTime before this timeout ends (Redisson's default is 30s).
# Lowered so the renewal demo finishes in seconds.
demo.lock-watchdog-timeout=5s
# The permit count of /semaphores/reports, read through @DistributedSemaphore(permits = "${...}").
demo.reports.max-concurrent=2

# A plain in-memory cache in each instance. Without this, Spring Boot would pick the JCache provider that
# Redisson ships, which has no configuration here and cannot create the "prices" cache.
spring.cache.type=simple

# The HTTP interface client calls the slow upstream served by this same app.
spring.http.serviceclient.upstream.base-url=http://localhost:${server.port:8080}

# Actuator: health, and metrics for the locksmith.acquire and locksmith.held timers.
management.endpoints.web.exposure.include=health,metrics
